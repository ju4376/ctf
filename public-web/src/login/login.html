<div class="container">
  <div class="login-box">
    <h1>LOGIN</h1>
    <div class="subtitle">Public Web Authentication</div>

    <form method="POST">
      <label>ID</label>

      <input type="text" name="username" autocomplete="off" placeholder="ID" />

      <label>Password</label>

      <input type="password" name="password" placeholder="Password" />

      <button type="submit">LOGIN</button>
    </form>
  </div>

  <?php if ($error !== ''): ?>

  <div class="result">
    <strong>Database Error</strong>

    <div class="error">
      <?= htmlspecialchars($error, ENT_QUOTES, 'UTF-8') ?>
    </div>
  </div>

  <?php endif; ?> <?php if ($loginError !== ''): ?>

  <div class="result">
    <div class="error">
      <?= htmlspecialchars($loginError, ENT_QUOTES, 'UTF-8') ?>
    </div>
  </div>

  <?php endif; ?> <?php if (!empty($resultRows)): ?>

  <div class="result">
    <table>
      <thead>
        <tr>
          <?php foreach (array_keys($resultRows[0]) as $column): ?>

          <th><?= htmlspecialchars($column, ENT_QUOTES, 'UTF-8') ?></th>

          <?php endforeach; ?>
        </tr>
      </thead>

      <tbody>
        <?php foreach ($resultRows as $row): ?>

        <tr>
          <?php foreach ($row as $value): ?>

          <td><?= htmlspecialchars((string)$value, ENT_QUOTES, 'UTF-8') ?></td>

          <?php endforeach; ?>
        </tr>

        <?php endforeach; ?>
      </tbody>
    </table>
  </div>

  <?php endif; ?>
</div>
